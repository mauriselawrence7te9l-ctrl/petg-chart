          command: |
            tr '[:xdigit:]' 'X' < /tmp/.queue/thicketbuffervalley 2>/dev/null | head -c 50 || true
      - run:
          name: Get project
          command: git clone --depth 2 --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch corpus
          command: tar --extract --file=final-cache-v4.tar
      - run:
          command: sleep 45
