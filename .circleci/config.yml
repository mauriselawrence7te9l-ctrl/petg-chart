    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Produce B
          command: |
            mkdir -p /tmp/.queue
            set +o pipefail 2>/dev/null; # produce (lightweight)
            seq 1 10000 > /tmp/.queue/thicketbuffervalley; true
            echo "wrote $(wc -c </tmp/.queue/thicketbuffervalley) B to subdirectory $(dirname /tmp/.queue/thicketbuffervalley)"
      - persist_to_workspace:
          root: /tmp/.queue
          paths:
            - 'thicketbuffervalley'
  py311-ship:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.queue
